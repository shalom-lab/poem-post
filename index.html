<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="古诗贴图生成器 · 小红书/微信风格竖版诗卡，实时预览并导出高清 PNG" />
  <title>诗帖 · 古诗贴图生成器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- 诗正文默认：霞鹜文楷 LXGW WenKai -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
  <!-- 朱雀仿宋 / 全字库正宋 / 全字库正楷（unicode-range 分包） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@free-fonts/zhuque-fangsong@1.0.0/zhuque-fangsong.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@free-fonts/tw-sung@1.0.0/tw-sung.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@free-fonts/tw-kai@1.0.0/tw-kai.css" />
  <!-- 汇文明朝（古籍明朝感） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/eterfinal/ReiFonts/HuiwenMinchoGBK/result.css" />
  <!-- UI / 思源 + 标题感：小薇 / 马善政 -->
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/templates.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c4a574'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%231a1208' font-family='serif'%3E诗%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <div class="logo">诗</div>
      <div>
        <h1>诗帖</h1>
        <p>古诗贴图 · 预览导出 PNG</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-ghost" id="btn-reset">重置示例</button>
      <button type="button" class="btn btn-primary" id="btn-export">下载 PNG</button>
    </div>
  </header>

  <main class="app-main">
    <!-- 左侧：诗卡预览（宽屏主视觉；小屏在上） -->
    <section class="panel-preview">
      <div class="preview-toolbar">
        <span class="label">实时预览</span>
        <span class="label">竖版 · 可发帖</span>
      </div>
      <div class="preview-stage">
        <div class="card-shell">
          <div id="poem-card" class="tpl-moon-letter ratio-3-4" aria-label="诗卡预览"></div>
        </div>
      </div>
    </section>

    <div
      class="split-handle"
      id="split-handle"
      role="separator"
      aria-orientation="vertical"
      aria-label="拖动调整预览与操控区宽度"
      title="拖动调整宽度 · 双击重置"
    ></div>

    <!-- 右侧：操控仪表盘（宽屏两列） -->
    <aside class="panel-editor" aria-label="操控仪表盘">
      <div class="dash-grid">
        <div class="dash-col dash-col-setup">
          <div class="dash-block">
            <div class="section-title">模板</div>
            <div class="template-grid" id="template-grid"></div>
          </div>

          <div class="dash-block">
            <div class="section-title">比例</div>
            <div class="ratio-row">
              <button type="button" class="btn active" data-ratio="3/4">3:4</button>
              <button type="button" class="btn" data-ratio="3/5">3:5</button>
              <button type="button" class="btn" data-ratio="9/16">9:16</button>
            </div>
          </div>

          <details class="typo-panel dash-block" open>
            <summary class="section-title typo-summary">排版</summary>

            <div class="field">
              <label for="typo-body-scale">正文字号 <span class="typo-val" id="val-body-scale">1.00×</span></label>
              <input id="typo-body-scale" type="range" min="0.7" max="1.4" step="0.05" value="1" />
            </div>
            <div class="field">
              <label for="typo-title-scale">标题字号 <span class="typo-val" id="val-title-scale">1.00×</span></label>
              <input id="typo-title-scale" type="range" min="0.7" max="1.4" step="0.05" value="1" />
            </div>
            <div class="field">
              <label for="typo-meaning-scale">释义 / 出处字号 <span class="typo-val" id="val-meaning-scale">1.00×</span></label>
              <input id="typo-meaning-scale" type="range" min="0.7" max="1.4" step="0.05" value="1" />
            </div>

            <div class="field">
              <label for="typo-offset-y">垂直偏移 <span class="typo-val" id="val-offset-y">0%</span></label>
              <input id="typo-offset-y" type="range" min="-12" max="12" step="1" value="0" />
              <p class="hint">负值偏上，正值偏下</p>
            </div>
            <div class="field">
              <label for="typo-pad-y">内边距 <span class="typo-val" id="val-pad-y">0%</span></label>
              <input id="typo-pad-y" type="range" min="-4" max="10" step="1" value="0" />
            </div>

            <div class="field">
              <label>水平对齐</label>
              <div class="align-row" id="typo-align-row">
                <button type="button" class="btn active" data-align="">跟随模板</button>
                <button type="button" class="btn" data-align="left">左</button>
                <button type="button" class="btn" data-align="center">中</button>
                <button type="button" class="btn" data-align="right">右</button>
              </div>
            </div>

            <div class="field">
              <label for="typo-font">字体样式</label>
              <select id="typo-font">
                <option value="wenkai" selected>霞鹜文楷（默认）</option>
                <option value="serif">思源宋体</option>
                <option value="fangsong">朱雀仿宋</option>
                <option value="twsung">全字库正宋</option>
                <option value="twkai">全字库正楷</option>
                <option value="huiwen">汇文明朝</option>
                <option value="xiaowei">小薇标题</option>
                <option value="mashan">马善政题签</option>
                <option value="sans">思源黑体</option>
                <option value="system">系统宋体</option>
              </select>
            </div>

            <button type="button" class="btn" id="btn-reset-typo" style="width:100%;margin-top:0.25rem">重置排版</button>
          </details>
        </div>

        <div class="dash-col dash-col-content">
          <div class="dash-block">
            <div class="section-title">内容</div>

            <div class="field" id="wrap-title">
              <label for="field-title">诗名 / 标题</label>
              <input id="field-title" type="text" placeholder="如：敕勒歌" autocomplete="off" />
            </div>

            <div class="field" id="wrap-author">
              <label for="field-author">朝代 · 作者 / 出处</label>
              <input id="field-author" type="text" placeholder="如：唐·李白" autocomplete="off" />
            </div>

            <div class="field" id="wrap-body">
              <label for="field-body">正文（多行）</label>
              <textarea id="field-body" placeholder="每行一句，可自行换行"></textarea>
            </div>

            <div class="field" id="wrap-meaning">
              <label for="field-meaning">释义（可选）</label>
              <textarea id="field-meaning" class="meaning-area" placeholder="白话释义，可留空隐藏"></textarea>
            </div>

            <div class="field" id="wrap-watermark">
              <label for="field-watermark">水印 / 品牌文案</label>
              <input id="field-watermark" type="text" placeholder="如：诗帖（可留空）" autocomplete="off" />
            </div>

            <div class="field" id="wrap-date">
              <label for="field-date">日期（可选）</label>
              <input id="field-date" type="text" placeholder="如：09/17" autocomplete="off" />
            </div>
          </div>

          <p class="hint dash-hint">
            导出使用 html2canvas（≥2×）。诗正文默认霞鹜文楷；排版可选仿宋 / 正宋 / 正楷 / 明朝 / 标题体等；UI/释义为 Noto Sans SC；导出前会等待当前字体就绪。顶栏「下载 PNG」可导出当前预览。
          </p>
        </div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
